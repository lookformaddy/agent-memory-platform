# CI definition for agent-memory-platform.
# NOTE: this file lives under docs/ on purpose — the GitHub App used for
# pushes lacks the Workflows permission, so it cannot create .github/workflows/.
# To activate CI, move this file to .github/workflows/ci.yml in the repo.
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
